# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # The C# library - PhotinoNETUtils/PhotinoNETUtils.csproj
  - package-ecosystem: nuget
    directory: /PhotinoNETUtils
    schedule:
      interval: daily
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The bridge package - UserInterface/package.json
  # No lockfile is committed on purpose, so this only covers direct dependencies.
  - package-ecosystem: npm
    directory: /UserInterface
    schedule:
      interval: daily
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The workflow files - .github/workflows/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore"
      include: "scope"

name: Release

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "dev/**"
      - "dependabot/**"
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE*"
      - ".github/workflows/dependabot-auto-merge.yml"
      - "build-and-copy.config.json"

permissions:
  contents: write

jobs:
  release:
    uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/workflows/csharp_npm_release.yml@main
    with:
      project_path: ./PhotinoNETUtils/PhotinoNETUtils.csproj
      version_file_path: ./PhotinoNETUtils/PhotinoNETUtils.csproj
      version_keyword: Version
      extra_version_files: |
        UserInterface/package.json|version
      npm_directory: ./UserInterface
      publish_nuget: true
      publish_npm: true
      filename: PhotinoNETUtils
      prerelease: false
    secrets: inherit
